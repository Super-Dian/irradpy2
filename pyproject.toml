[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "irradpy2"
version = "1.2.1"
description = "Multi-source solar irradiance data acquisition, modeling, separation, and forecasting toolkit."
readme = "readme.md"
requires-python = ">=3.10"
license = "MIT"


keywords = [
    "solar irradiance",
    "meteorological data",
    "data acquisition",
    "clear-sky modeling",
    "clear-sky detection",
    "irradiance separation",
    "solar forecasting",
]

classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
]

dependencies = [
    "numpy",
    "pandas",
    "matplotlib",
    "requests",
    "pytz",
    "scikit-learn",
    "torch",
    "scipy",
    "statsmodels",
    "cdsapi>=0.7.7",
    "netCDF4",
    "xarray",
    "dask[array]",
    "earthaccess",
    "pydap>=3.5.9",
]

[project.urls]
Homepage = "https://github.com/Super-Dian/irradpy2"
Repository = "https://github.com/Super-Dian/irradpy2"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"irradpy2.clear_sky" = ["AEROSOL-TABLE.txt", "adelaide_airport_inputs_sample.csv"]
