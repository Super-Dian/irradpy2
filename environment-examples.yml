# Conda environment for running src/irradpy2/example/ (exported 2026-10-17,
# macOS arm64 / python 3.12). Create from the repository root:
#
#   conda env create -f environment-examples.yml
#   conda run -n irradpy2_examples pip install -e .    # install irradpy2 itself
#
# If the environment name already exists: conda env remove -n irradpy2_examples
# The examples additionally need network access to gml.noaa.gov (SURFRAD).
name: irradpy2_examples
channels:
  - defaults
dependencies:
